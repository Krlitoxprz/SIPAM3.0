<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<style>
  @page {
    size: A4 portrait;
    margin: 15mm 15mm 18mm 15mm;
    @bottom-center {
      content: "SIPAM-USCO · " attr(data-codigo) " · Pág. " counter(page) " de " counter(pages);
      font-size: 7pt; color: #888; font-family: Arial, sans-serif;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; font-size: 9pt; color: #1a1a1a; }

  /* ── Header institucional ── */
  .header { display: flex; border: 1px solid #8D191D; margin-bottom: 6pt; }
  .header-logo {
    width: 38mm; border-right: 1px solid #8D191D; padding: 4pt 6pt;
    display: flex; flex-direction: column; justify-content: center;
  }
  .header-logo .univ { font-size: 8.5pt; font-weight: bold; color: #8D191D; line-height: 1.3; }
  .header-logo .sub  { font-size: 6.5pt; color: #4E6470; margin-top: 2pt; }
  .header-title {
    flex: 1; background: #F5F2EA; display: flex; align-items: center;
    justify-content: center; padding: 4pt 8pt; border-right: 1px solid #8D191D;
  }
  .header-title span { font-size: 10.5pt; font-weight: bold; color: #8D191D; text-align: center; }
  .header-meta { width: 38mm; padding: 4pt 6pt; font-size: 7pt; display: flex; flex-direction: column; gap: 3pt; }
  .header-meta .kv { display: flex; gap: 4pt; }
  .header-meta .kv b { color: #333; }

  .vigencia {
    background: #F5F2EA; border: 1px solid #C8B980; padding: 3pt 6pt;
    font-size: 7pt; font-style: italic; color: #786028; margin-bottom: 5pt;
  }

  /* ── Sección ── */
  .section-title {
    background: #8D191D; color: white; font-size: 8pt; font-weight: bold;
    padding: 3pt 6pt; text-transform: uppercase; margin: 5pt 0 2pt 0;
  }

  /* ── Tabla de datos ── */
  table { width: 100%; border-collapse: collapse; margin-bottom: 3pt; }
  table td, table th {
    border: 1px solid #CCC; padding: 3pt 5pt; font-size: 8.5pt; vertical-align: top;
  }
  table th { background: #8D191D; color: white; font-weight: bold; text-align: center; }
  table td.label { background: #F0EEE8; font-weight: bold; color: #333; width: 38%; }
  table td.alt   { background: #F8F8F8; }
  .check-row td  { border: 1px solid #CCC; padding: 3pt 5pt; }

  /* ── Checkbox ── */
  .cb { display: inline-block; width: 9pt; height: 9pt; border: 1pt solid #8D191D;
        vertical-align: middle; margin-right: 3pt; }
  .cb.checked { background: #8D191D; }

  /* ── Texto largo ── */
  .text-block {
    border: 1px solid #C8B980; background: #FCFAF8; padding: 5pt 6pt;
    min-height: 18pt; font-size: 8.5pt; margin-bottom: 4pt; white-space: pre-wrap;
  }

  /* ── Firma ── */
  .firmas { display: flex; gap: 6pt; margin-top: 10pt; }
  .firma-box {
    flex: 1; border: 1px solid #CCC; text-align: center; padding: 4pt;
  }
  .firma-box .titulo {
    background: #F5F2EA; font-weight: bold; font-size: 7pt; color: #8D191D;
    padding: 2pt; text-transform: uppercase; margin-bottom: 18pt;
  }
  .firma-box .linea { border-top: 1px solid #999; margin: 0 8pt; padding-top: 3pt; }
  .firma-box .nombre { font-size: 7pt; color: #444; }

  /* ── Utilidades ── */
  .page-break { page-break-before: always; }
  .bold { font-weight: bold; }
  .vinotinto { color: #8D191D; }
  .small { font-size: 7.5pt; }
  .center { text-align: center; }
  .right  { text-align: right; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
